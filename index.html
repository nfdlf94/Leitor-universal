/* ═════════ 11. FOTO E NAVEGAÇÃO ═════════ */
$("#bFoto").onclick=()=>$("#arq").click();
$("#arq").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const im=new Image();
  im.onload=()=>{
    const alvo=Math.min(1400,im.width);
    tmp.width=alvo; tmp.height=Math.round(im.height*alvo/im.width);
    tctx.drawImage(im,0,0,tmp.width,tmp.height);
    const d=tctx.getImageData(0,0,tmp.width,tmp.height);
    let src=cinza(d), quad=fiduciais(reduzir(src,700));
    if(!quad && tentarOutroLayout()) quad=fiduciais(reduzir(src,700));
    if(!quad){ faixa("Cartão não encontrado na foto","Enquadre a moldura inteira",true); return; }
    const p=lerQR(src,quad);
    const r=p?aplicarQR(p):false;
    if(r==="trocou"){ quad=fiduciais(reduzir(src,700)); }
    if(!r){ faixa("QR ilegível nesta foto","Use a aba Manual",true); return; }
    if(!quad) return;
    const L=lerBolhas(src,quad); if(!L) return;
    ultimoQuad=quad; travar(L); };
  im.src=URL.createObjectURL(f); e.target.value=""; };

function irPara(v){
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  if(v!=="ler"&&rodando) parar();
  if(v==="casa") montarCasa();
  if(v==="man") montarManual();
  if(v==="des") pintarDesempenho();
  if(v==="res") pintarResultados();
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>irPara(b.dataset.v));
$("#bIniciar").onclick=iniciar; $("#bParar").onclick=parar;
$("#bTrocar").onclick=()=>{
  const aba=[...document.querySelectorAll("nav button")].find(b=>b.classList.contains("on"));
  const v=aba?aba.dataset.v:"casa";
  if(v==="res"){ seletorAberto.resSel=true; pintarResultados(); return; }
  if(v==="des"){ seletorAberto.desSel=true; pintarDesempenho(); return; }
  casaNivel="turmas"; irPara("casa"); };

/* ═══════════════════════════════════════════════════════════════════
   FUNCIONAMENTO SEM INTERNET
   O Service Worker guarda os arquivos do app no aparelho. Os dados
   (turmas, provas, notas) já eram locais — não há servidor envolvido.
   ═══════════════════════════════════════════════════════════════════ */
function avisoFlutuante(texto, cls, segundos){
  const d=document.createElement("div");
  d.className=cls||"diag";
  d.style.cssText="position:fixed;left:10px;right:10px;bottom:calc(72px + env(safe-area-inset-bottom));"+
    "z-index:99;box-shadow:0 8px 24px #0009";
  d.innerHTML=texto;
  document.body.appendChild(d);
  if(segundos) setTimeout(()=>d.remove(), segundos*1000);
  return d;
}

(function ligarOffline(){
  if(!("serviceWorker" in navigator)) return;
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", ()=>{
        const novo=reg.installing;
        if(!novo) return;
        novo.addEventListener("statechange", ()=>{
          if(novo.state==="installed" && navigator.serviceWorker.controller){
            const a=avisoFlutuante('<b>Atualização disponível</b>'+
              'Uma versão nova do app foi baixada. '+
              '<button class="btn" id="swAgora" style="margin-top:9px;padding:9px">Usar agora</button>');
            a.querySelector("#swAgora").onclick=()=>{
              novo.postMessage("assumir"); location.reload(); };
          }
        });
      });
    }).catch(e=>console.warn("service worker não registrou",e));
  });

  let jaTrocou=false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if(jaTrocou) return; jaTrocou=true;
    avisoFlutuante('<b>App atualizado</b>Guardando a versão nova no aparelho.',"diag",4);
  });

  const mostrarRede=()=>{
    if(navigator.onLine) return;
    avisoFlutuante('<b>Sem internet</b>O app funciona normalmente. '+
      'Só a leitura de prova pela Claude precisa de rede.', "aviso", 6);
  };
  window.addEventListener("offline", mostrarRede);
})();

(function conferirPecas(){
  const faltando=[];
  if(typeof jsQR!=="function") faltando.push("jsqr.js");
  if(typeof embaralharProva!=="function") faltando.push("embaralho.js");
  if(typeof montarLayout!=="function") faltando.push("layout.js");
  if(typeof fiduciais!=="function") faltando.push("núcleo de leitura");
  if(typeof window.jspdf==="undefined") faltando.push("jspdf.umd.min.js");
  if(typeof qrcode!=="function") faltando.push("qrcode.min.js");
  if(typeof gerarProvas!=="function") faltando.push("gerador.js");
  if(typeof registrarFontes!=="function") faltando.push("fonte.js");
  if(typeof mammoth==="undefined") faltando.push("mammoth.browser.min.js");
  if(typeof pdfjsLib==="undefined") faltando.push("pdf.min.js");
  if(faltando.length){
    const d=document.createElement("div");
    d.className="aviso";
    d.style.cssText="position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));z-index:99";
    d.textContent="Faltou carregar: "+faltando.join(", ")+". Envie todos os arquivos para o GitHub e recarregue.";
    document.body.appendChild(d);
  }
})();

faixa("Toque em iniciar câmera",
