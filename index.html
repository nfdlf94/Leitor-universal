<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{
  --ink:#071324; --navy:#0E2145; --slate:#17294A; --line:#243B64;
  --orange:#F97316; --amber:#FBBF24; --mint:#34D399; --coral:#FB5A5A;
  --paper:#F2F4F8; --mute:#7E93B8;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:15px;
  line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:var(--paper);background:var(--navy);
  border:1px solid var(--line);border-radius:10px;padding:11px 13px;width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--orange);outline-offset:1px}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100dvh}
#views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;display:none;
  padding:14px 14px calc(20px + env(safe-area-inset-bottom))}
.view.on{display:block}
#v-ler{padding:0;overflow:hidden}

nav{display:flex;background:var(--navy);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);flex:0 0 auto}
nav button{flex:1;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;
  gap:3px;color:var(--mute);font-size:9px;letter-spacing:.06em;text-transform:uppercase;
  font-weight:600;border-top:2px solid transparent;margin-top:-1px;position:relative}
nav button.on{color:var(--orange);border-top-color:var(--orange)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav .pill{position:absolute;top:5px;left:56%;background:var(--orange);color:var(--ink);
  font-family:var(--mono);font-size:9px;font-weight:700;min-width:15px;padding:0 4px;
  border-radius:8px;line-height:1.5}

#palco{position:absolute;inset:0;background:#000;overflow:hidden}
#video,#over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%}
#video{object-fit:cover}
#faixa{position:absolute;top:0;left:0;right:0;
  padding:calc(10px + env(safe-area-inset-top)) 14px 22px;
  background:linear-gradient(#071324f2,#07132400);display:flex;gap:11px;align-items:flex-start}
#faixa .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);margin-top:6px;
  flex:0 0 auto;animation:pulso 1.6s infinite}
@keyframes pulso{0%{box-shadow:0 0 0 0 #fbbf2466}70%{box-shadow:0 0 0 9px #fbbf2400}100%{box-shadow:0 0 0 0 #fbbf2400}}
#faixa .t{font-weight:600;font-size:14.5px;line-height:1.3}
#faixa .s{color:var(--mute);font-size:12px;font-family:var(--mono);margin-top:2px}
#grade{position:absolute;right:11px;bottom:96px;background:#071324e0;border:1px solid var(--line);
  border-radius:13px;padding:9px 8px;backdrop-filter:blur(7px);display:grid;
  grid-template-columns:auto repeat(5,14px);gap:3px;font-family:var(--mono);font-size:9.5px;
  align-items:center}
#grade .h{color:var(--mute);text-align:center;font-size:8.5px}
#grade .q{color:var(--mute);font-size:9px;padding-right:3px;text-align:right}
#grade i{width:14px;height:11px;border-radius:3px;background:#1b3055;display:block}
#grade i.on{background:var(--orange)} #grade i.lk{background:var(--mint)}
#rodape{position:absolute;left:0;right:0;bottom:0;padding:14px;
  background:linear-gradient(#07132400,#071324f2 40%)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border-radius:13px;font-weight:600;font-size:15.5px;background:var(--orange);color:#231000;
  transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--slate);color:var(--paper);border:1px solid var(--line)}
.btn.gho{background:none;color:var(--mute);border:1px solid var(--line)}
.btn[disabled]{opacity:.4;pointer-events:none}
.linha{display:flex;gap:9px}

#painel{position:absolute;inset:0;background:var(--ink);z-index:20;display:none;
  flex-direction:column;padding:0 14px calc(14px + env(safe-area-inset-bottom));overflow-y:auto}
#painel.on{display:flex}
#nota{display:flex;align-items:baseline;gap:11px;padding:20px 0 4px}
#nota b{font-family:var(--mono);font-size:54px;font-weight:600;line-height:.9;letter-spacing:-.04em}
#nota span{color:var(--mute);font-family:var(--mono);font-size:13px}
.rot{color:var(--mute);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;margin:22px 0 9px}
#conf,#manGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px}
.qc{background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:8px 5px 9px;
  text-align:center}
.qc .n{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.qc .a{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.15}
.qc .g{font-family:var(--mono);font-size:9.5px;color:var(--mute)}
.qc.ok{border-color:#34d39955} .qc.ok .a{color:var(--mint)}
.qc.no{border-color:#fb5a5a55} .qc.no .a{color:var(--coral)}
.qc.vz .a{color:var(--mute)}

.card{background:var(--navy);border:1px solid var(--line);border-radius:15px;padding:14px;
  margin-bottom:11px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--mute);font-size:12.5px}
label{display:block;color:var(--mute);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  font-weight:600;margin:13px 0 6px}
.mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
h2{font-size:20px;font-weight:600;margin:6px 0 3px}
.sub{color:var(--mute);font-size:12.5px;margin:0 0 16px}

.aluno{display:flex;align-items:center;gap:11px;padding:11px 12px;background:var(--navy);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;width:100%;text-align:left}
.aluno .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.aluno .rs{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.08em}
.aluno .nt{font-family:var(--mono);font-size:19px;font-weight:600}

.barra{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.barra .q{font-family:var(--mono);font-size:10.5px;color:var(--mute);width:26px;flex:0 0 auto}
.barra .lb{font-size:11.5px;color:var(--paper);flex:0 0 118px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.barra .t{flex:1;height:18px;background:var(--slate);border-radius:5px;overflow:hidden}
.barra .f{height:100%;background:var(--mint);border-radius:5px;transition:width .5s}
.barra .f.baixo{background:var(--coral)} .barra .f.medio{background:var(--amber)}
.barra .p{font-family:var(--mono);font-size:11px;width:36px;text-align:right;flex:0 0 auto}

.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.kpi div{background:var(--navy);border:1px solid var(--line);border-radius:13px;padding:11px 10px}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;line-height:1.1}
.kpi .l{color:var(--mute);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;margin-top:2px}

.vazio{text-align:center;padding:52px 22px;color:var(--mute)}
.vazio b{display:block;color:var(--paper);font-size:16px;font-weight:600;margin-bottom:5px}
.aviso{background:#f9731618;border:1px solid #f9731644;color:#FDBA74;border-radius:11px;
  padding:10px 12px;font-size:12.5px;margin-bottom:11px}
.diag{background:var(--navy);border:1px solid var(--line);border-left:3px solid var(--orange);
  border-radius:11px;padding:12px 13px;margin-bottom:9px;font-size:13px}
.diag b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--orange);margin-bottom:5px}
.diag ul{margin:5px 0 0;padding-left:17px} .diag li{margin-bottom:3px}
.diag strong{display:inline;font-weight:600;color:var(--orange);
  font-size:inherit;letter-spacing:normal;text-transform:none;margin:0}

.opt{display:grid;grid-template-columns:auto repeat(5,1fr);gap:5px;align-items:center;
  margin-bottom:5px}
.opt .qn{font-family:var(--mono);font-size:11px;color:var(--mute);width:24px}
.opt button{border:1px solid var(--line);background:var(--navy);border-radius:9px;padding:9px 0;
  font-family:var(--mono);font-size:13px;font-weight:600;color:var(--mute)}
.opt button.sel{background:var(--orange);border-color:var(--orange);color:#231000}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ── acréscimos da versão universal ───────────────────────────── */
#barra{flex:0 0 auto;background:var(--navy);border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 14px 9px;display:flex;align-items:center;gap:10px}
#barra .ctx{flex:1;min-width:0}
#barra .l1{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#barra .l2{color:var(--mute);font-size:10.5px;font-family:var(--mono);letter-spacing:.06em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
#barra .tr{background:var(--slate);border:1px solid var(--line);border-radius:9px;
  padding:7px 11px;font-size:11.5px;color:var(--paper);font-weight:600;flex:0 0 auto}
#barra.off .l1{color:var(--mute);font-weight:500}

.grupo{margin-bottom:20px}
.grupo>.esc{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.grupo>.esc .nm{font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;color:var(--orange)}
.grupo>.esc .ln{flex:1;height:1px;background:var(--line)}

.item{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--navy);
  border:1px solid var(--line);border-radius:12px;margin-bottom:7px;width:100%;text-align:left}
.item.sel{border-color:var(--orange);background:#f973160f}
.item .cor{flex:1;min-width:0}
.item .t1{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{color:var(--mute);font-size:11.5px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ch{color:var(--mute);font-size:19px;flex:0 0 auto}
.item .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;padding:3px 7px;
  border-radius:7px;background:var(--slate);color:var(--mute);flex:0 0 auto}
.item .tag.ok{background:#34d39922;color:var(--mint)}
.item .tag.par{background:#fbbf2422;color:var(--amber)}

.migalha{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:11.5px;
  margin-bottom:12px;flex-wrap:wrap}
.migalha button{color:var(--orange);font-weight:600;font-size:11.5px}
.hint{color:var(--mute);font-size:12px;margin:9px 0 0;line-height:1.5}
textarea{min-height:132px;resize:vertical;font-family:var(--mono);font-size:12.5px;
  letter-spacing:.02em;line-height:1.6}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--slate);
  border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:11.5px;
  margin:0 6px 6px 0;font-family:var(--mono)}
.chip b{color:var(--orange);font-weight:600}
#gabGrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
.gq{background:var(--navy);border:1px solid var(--line);border-radius:10px;
  padding:6px 4px 7px;text-align:center}
.gq .n{font-family:var(--mono);font-size:9px;color:var(--mute)}
.gq .a{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--orange);line-height:1.2}
</style>
</head>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   1. LAYOUT ATIVO — agora é variável: cada prova traz o seu.
      Preenchido por aplicarLayout(); o núcleo de visão abaixo só lê.
   ═══════════════════════════════════════════════════════════════════ */
let LAY = layoutNormalizado(10, 5);      // padrão até haver prova ativa
let NQ = 10, NO = 5;
let IDX = [0,1,2,3,4];

function aplicarLayout(nq, no){
  if(LAY && LAY.n_questions === nq && LAY.n_options === no) return false;
  LAY = layoutNormalizado(nq, no);
  NQ = nq; NO = no;
  IDX = Array.from({length:no}, (_,i)=>i);
  const g = document.getElementById("grade");
  if(g){ g.dataset.pronto = ""; g.innerHTML = "";
    g.style.gridTemplateColumns = "auto repeat(" + no + ",14px)"; }
  return true;
}

/* ═══════════════════════════════════════════════════════════════════
   2. VISÃO COMPUTACIONAL — idêntica à versão validada em sala.
   ═══════════════════════════════════════════════════════════════════ */
function cinza(img){                       // ImageData -> {g,w,h}
  const {data,width:w,height:h}=img, g=new Uint8ClampedArray(w*h);
  for(let i=0,p=0;i<g.length;i++,p+=4)
    g[i]=(data[p]*77+data[p+1]*151+data[p+2]*28)>>8;
  return {g,w,h};
}
function reduzir(s,alvo){                  // subamostragem por caixa
  if(s.w<=alvo) return s;
  const e=Math.ceil(s.w/alvo), w=(s.w/e)|0, h=(s.h/e)|0, g=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let t=0; const y0=y*e,x0=x*e;
    for(let j=0;j<e;j++){const r=(y0+j)*s.w; for(let i=0;i<e;i++) t+=s.g[r+x0+i];}
    g[y*w+x]=t/(e*e);
  }
  return {g,w,h,esc:e};
}
function planificar(s){                    // corrige gradiente de luz
  const {g,w,h}=s, I=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){let lin=0;
    for(let x=0;x<w;x++){lin+=g[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+lin;}}
  const r=Math.max(2,Math.round(w*0.055)), o=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-r), y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-r), x1=Math.min(w,x+r+1);
      const som=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0];
      const bg=som/((y1-y0)*(x1-x0))+1;
      o[y*w+x]=Math.min(255,g[y*w+x]/bg*200);
    }}
  return {g:o,w,h};
}
function otsu(g){
  const H=new Float64Array(256); for(let i=0;i<g.length;i++)H[g[i]]++;
  let sm=0; for(let t=0;t<256;t++) sm+=t*H[t];
  let wB=0,sB=0,best=-1,th=128;
  for(let t=0;t<256;t++){ wB+=H[t]; if(!wB)continue;
    const wF=g.length-wB; if(wF<=0)break; sB+=t*H[t];
    const v=wF*wB*Math.pow(sB/wB-(sm-sB)/wF,2); if(v>best){best=v;th=t;} }
  return th;
}
/* blobs escuros que são quadrados sólidos, com testes invariantes à rotação */
function fiduciais(s){
  const F=planificar(s), th=otsu(F.g)*0.92, {w,h}=F, N=w*h;
  const vis=new Uint8Array(N), pil=new Int32Array(N), cands=[];
  for(let p=0;p<N;p++){
    if(vis[p]||F.g[p]>=th) continue;
    let top=0; pil[top++]=p; vis[p]=1;
    let n=0,sx=0,sy=0,sxx=0,sxy=0,syy=0;
    while(top){
      const q=pil[--top], x=q%w, y=(q/w)|0;
      n++; sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; syy+=y*y;
      if(x>0   && !vis[q-1] && F.g[q-1]<th){vis[q-1]=1;pil[top++]=q-1;}
      if(x<w-1 && !vis[q+1] && F.g[q+1]<th){vis[q+1]=1;pil[top++]=q+1;}
      if(y>0   && !vis[q-w] && F.g[q-w]<th){vis[q-w]=1;pil[top++]=q-w;}
      if(y<h-1 && !vis[q+w] && F.g[q+w]<th){vis[q+w]=1;pil[top++]=q+w;}
    }
    if(n<N*5e-4 || n>N*0.05) continue;   // 5e-4: acha o cartão mesmo com muita margem branca em volta
    const mx=sx/n, my=sy/n;
    const u20=sxx/n-mx*mx, u02=syy/n-my*my, u11=sxy/n-mx*my;
    const tr=u20+u02, di=Math.hypot(u20-u02,2*u11);
    const l1=(tr+di)/2, l2=(tr-di)/2;
    if(l2<=1e-6) continue;
    if(!(Math.sqrt(l1/l2)>0.72 && Math.sqrt(l1/l2)<1.38)) continue;   // isotrópico
    const cheio=n/(12*Math.sqrt(l1*l2));                              // sólido ≈ 1
    if(!(cheio>0.84 && cheio<1.22)) continue;
    cands.push({x:mx,y:my,a:n});
  }
  if(cands.length<4) return null;
  const amax=Math.max(...cands.map(c=>c.a));
  let C=cands.filter(c=>c.a>=0.40*amax).sort((x,y)=>y.a-x.a).slice(0,8)
             .map(c=>[c.x,c.y]);
  if(C.length<4) return null;
  if(C.length>4) C=melhorQuatro(C);
  const q=orientar(C,F,th);
  if(!q) return null;
  const k=s.esc||1;
  return q.map(p=>[p[0]*k,p[1]*k]);
}
const areaPoli=P=>{ let A=0;
  for(let i=0;i<P.length;i++){const j=(i+1)%P.length; A+=P[i][0]*P[j][1]-P[j][0]*P[i][1];}
  return Math.abs(A/2); };
function ciclico(P){                      // ordem cíclica em volta do centroide
  const cx=P.reduce((s,p)=>s+p[0],0)/P.length, cy=P.reduce((s,p)=>s+p[1],0)/P.length;
  return P.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
}
function melhorQuatro(P){                 // os 4 que formam o maior quadrilátero
  let best=null,ba=-1;
  for(let a=0;a<P.length-3;a++) for(let b=a+1;b<P.length-2;b++)
    for(let c=b+1;c<P.length-1;c++) for(let d=c+1;d<P.length;d++){
      const q=ciclico([P[a],P[b],P[c],P[d]]), ar=areaPoli(q);
      if(ar>ba){ba=ar;best=q;}
    }
  return best;
}
function convexo(q){
  let sg=0;
  for(let i=0;i<4;i++){
    const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const z=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(z===0) continue; const g=Math.sign(z);
    if(sg && g!==sg) return false; sg=g;
  }
  return true;
}
/* fração de pixels escuros na janela do QR, medida na imagem planificada:
   ~0,45 na orientação correta e ~0,05 nas outras sete */
function massaQR(F,th,q){
  const W=600, H=W/LAY.aspect, Hm=homografia(q,W,H); if(!Hm) return 0;
  const {g,w,h}=F; let esc=0,n=0;
  for(let i=0;i<20;i++) for(let j=0;j<20;j++){
    const u=(LAY.qr.x0+(LAY.qr.x1-LAY.qr.x0)*(i+0.5)/20)*W;
    const v=(LAY.qr.y0+(LAY.qr.y1-LAY.qr.y0)*(j+0.5)/20)*H;
    const p=proj(Hm,u,v), xi=Math.round(p[0]), yi=Math.round(p[1]); n++;
    if(xi>=0&&yi>=0&&xi<w&&yi<h&&g[yi*w+xi]<th) esc++;
  }
  return esc/n;
}
/* testa as 8 orientações possíveis: filtra pela proporção, desempata pelo QR.
   Não usa extremos — por isso tolera rotação forte sem inverter o cartão. */
function orientar(P,F,th){
  const ciclo=ciclico(P), dirs=[ciclo,ciclo.slice().reverse()];
  let melhor=null, best=1e9;
  for(const dir of dirs) for(let r=0;r<4;r++){
    const q=[0,1,2,3].map(i=>dir[(i+r)%4]);
    const d=(a,b)=>Math.hypot(q[a][0]-q[b][0],q[a][1]-q[b][1]);
    const lg=(d(0,1)+d(3,2))/2, at=(d(0,3)+d(1,2))/2;
    if(at<1e-6) continue;
    const razao=(lg/at)/LAY.aspect;
    if(!(razao>0.55 && razao<1.80)) continue;
    if(!convexo(q)) continue;
    const fr=massaQR(F,th,q);
    if(fr<0.22) continue;
    const custo=-fr*100+Math.abs(Math.log(razao))*40;
    if(custo<best){ best=custo; melhor=q; }
  }
  if(!melhor) return null;
  return areaPoli(melhor)>F.w*F.h*0.02 ? melhor : null;
}
/* homografia: retângulo (0,0)-(W,H) -> quadrilátero da foto */
function homografia(q,W,H){
  const s=[[0,0],[W,0],[W,H],[0,H]], A=[], b=[];
  for(let i=0;i<4;i++){
    const [u,v]=s[i], [x,y]=q[i];
    A.push([u,v,1,0,0,0,-u*x,-v*x]); b.push(x);
    A.push([0,0,0,u,v,1,-u*y,-v*y]); b.push(y);
  }
  for(let c=0;c<8;c++){                                 // eliminação de Gauss
    let p=c; for(let r=c+1;r<8;r++) if(Math.abs(A[r][c])>Math.abs(A[p][c])) p=r;
    [A[c],A[p]]=[A[p],A[c]]; [b[c],b[p]]=[b[p],b[c]];
    if(Math.abs(A[c][c])<1e-12) return null;
    for(let r=0;r<8;r++){ if(r===c) continue;
      const f=A[r][c]/A[c][c];
      for(let k=c;k<8;k++) A[r][k]-=f*A[c][k];
      b[r]-=f*b[c];
    }
  }
  const h=b.map((v,i)=>v/A[i][i]);
  return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];
}
const proj=(H,u,v)=>{ const d=H[6]*u+H[7]*v+1;
  return [(H[0]*u+H[1]*v+H[2])/d,(H[3]*u+H[4]*v+H[5])/d]; };

let DISCO=null, ANEL=null, RB=0;
function amostras(rb){
  if(RB===rb) return; RB=rb;
  const ri=rb*0.60; DISCO=[];
  for(let dy=-ri;dy<=ri;dy+=1.3) for(let dx=-ri;dx<=ri;dx+=1.3)
    if(dx*dx+dy*dy<=ri*ri) DISCO.push([dx,dy]);
  ANEL=[];
  for(let i=0;i<32;i++){ const a=i/32*6.2832;
    ANEL.push([Math.cos(a)*rb*1.30,Math.sin(a)*rb*1.30]);
    ANEL.push([Math.cos(a)*rb*1.62,Math.sin(a)*rb*1.62]); }
}
function lerBolhas(src,quad){
  const W=1000, H=W/LAY.aspect, Hm=homografia(quad,W,H);
  if(!Hm) return null;
  amostras(LAY.bubble_r*W);
  const {g,w,h}=src;
  const px=(x,y)=>{ const xi=Math.round(x),yi=Math.round(y);
    return (xi<0||yi<0||xi>=w||yi>=h)?255:g[yi*w+xi]; };
  const R=[], mark=[];
  for(let q=1;q<=NQ;q++){
    const fi=LAY.bubbles[q].map(([nx,ny])=>{
      const u=nx*W, v=ny*H, an=[];
      for(const [dx,dy] of ANEL){const p=proj(Hm,u+dx,v+dy); an.push(px(p[0],p[1]));}
      an.sort((a,b)=>a-b);
      const branco=an[an.length>>1], lim=Math.max(40,branco*0.66);
      let d=0; for(const [dx,dy] of DISCO){const p=proj(Hm,u+dx,v+dy); if(px(p[0],p[1])<lim)d++;}
      return d/DISCO.length;
    });
    const or=IDX.slice().sort((a,b)=>fi[b]-fi[a]);
    const b1=fi[or[0]], b2=fi[or[1]];
    if(b1<0.38){ R.push(null); mark.push("BRANCO"); }
    else if(b2>0.55*b1 && b2>0.34){ R.push(null); mark.push("DUPLA"); }
    else { R.push(LAY.options[or[0]]); mark.push("OK"); }
  }
  return {R,mark};
}
function lerQR(src,quad){
  if(typeof jsQR!=="function") return null;
  const W=1500, H=W/LAY.aspect, Hm=homografia(quad,W,H); if(!Hm) return null;
  const pad=0.02, L=560;
  const u0=(LAY.qr.x0-pad)*W, v0=(LAY.qr.y0-pad)*H;
  const u1=(LAY.qr.x1+pad)*W, v1=(LAY.qr.y1+pad)*H;
  const {g,w,h}=src, gr=new Uint8ClampedArray(L*L);
  /* amostragem bilinear: com o cartão girado ou pequeno na foto, o vizinho
     mais próximo serrilha as bordas dos módulos e o QR deixa de decodificar */
  const bilinear=(x,y)=>{
    if(x<0||y<0||x>w-1||y>h-1) return 255;
    const x0=x|0, y0=y|0, x1=x0+1<w?x0+1:x0, y1=y0+1<h?y0+1:y0;
    const fx=x-x0, fy=y-y0;
    const a=g[y0*w+x0], b=g[y0*w+x1], c=g[y1*w+x0], d=g[y1*w+x1];
    return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
  };
  for(let j=0;j<L;j++){
    const v=v0+(v1-v0)*j/(L-1);
    for(let i=0;i<L;i++){
      const p=proj(Hm,u0+(u1-u0)*i/(L-1),v);
      gr[j*L+i]=bilinear(p[0],p[1]);
    }}
  let mn=255,mx=0;                                   // realce de contraste
  for(const t of gr){ if(t<mn)mn=t; if(t>mx)mx=t; }
  const dv=Math.max(1,mx-mn);
  const out=new Uint8ClampedArray(L*L*4);
  for(let i=0;i<L*L;i++){
    const t=Math.max(0,Math.min(255,(gr[i]-mn)*255/dv)), o=i*4;
    out[o]=out[o+1]=out[o+2]=t; out[o+3]=255;
  }
  try{ const r=jsQR(out,L,L,{inversionAttempts:"dontInvert"}); return r?r.data:null; }
  catch(e){ return null; }
}

/* Calendário por segmento — o 3º ano fecha em trimestres, a EJA em
   bimestres (só dois, pelo módulo), e o fundamental em quatro bimestres. */
function semear(){
  const T=(escola,nome,serie,disciplina,tipo,qtd)=>({id:"t-"+nome,escola,nome,serie,
    disciplina,alunos:[],periodo:{tipo,qtd}});
  return {
    v:5,
    escolas:[
      {id:"jc",nome:"EREM Senador João Cleofas de Oliveira",curto:"João Cleofas"},
      {id:"ra",nome:"E.M. Doutor Rodolfo Aureliano",curto:"Rodolfo Aureliano"}],
    turmas:[
      T("jc","3A","3º ano","Matemática","trimestre",3),
      T("jc","3B","3º ano","Matemática","trimestre",3),
      T("jc","3C","3º ano","Matemática Básica","trimestre",3),
      T("jc","3D","3º ano","Matemática Básica","trimestre",3),
      T("jc","M3A","EJA Módulo 3","Matemática","bimestre",2),
      T("jc","M3B","EJA Módulo 3","Matemática","bimestre",2),
      T("ra","8A","8º ano","Matemática","bimestre",4),
      T("ra","8B","8º ano","Matemática","bimestre",4),
      T("ra","8C","8º ano","Matemática","bimestre",4),
      T("ra","8D","8º ano","Matemática","bimestre",4),
      T("ra","9E","9º ano","Matemática","bimestre",4)],
    provas:[], ativa:null, res:[]
  };
}

let E=(()=>{
  const novo=guarda.ler("dbm_omr_v5")||guarda.ler("dbm_omr_v4");

          alunos:[],periodo:{tipo:"bimestre",qtd:4}};
          base.turmas.push(t); }
        Object.entries(mapa).forEach(([num,nome])=>{
          if(!t.alunos.some(a=>a.numero===num)) t.alunos.push({numero:num,nome,desde:1,ate:null}); });
        t.alunos.sort((a,b)=>ordNum(a.numero,b.numero));
      });
      const alvo=base.turmas.filter(t=>(velho.turmas||{})[t.nome]);
      alvo.forEach(t=>{
        const p={id:uid("p"),turma:t.id,codigo:velho.id||"PROVA",
          titulo:"Prova importada da versão anterior",
          nq:velho.gabC.length,no:5,gabC:velho.gabC,

        base.provas.push(p);
        (velho.alunos||[]).filter(a=>a.turma===t.nome).forEach(a=>{
          base.res.push(Object.assign({},a,{prova:p.id,turma:t.id})); });
      });
      if(base.provas.length) base.ativa=base.provas[0].id;
    }
  }catch(e){ console.warn("nada a migrar",e); }
  return base;
})();

const LETRAS_ATE=n=>["A","B","C","D","E"][n-1];
const calendario=t=>(t&&t.periodo)||{tipo:"bimestre",qtd:4};
/* Um estudante pertence à turma de um período de entrada até um de saída.
   Quem se transfere NÃO é apagado: as notas dos períodos que ele cursou
   continuam valendo, e ele some das listas dos períodos seguintes. */
const entrou=a=>a.desde||1;
const saiu=a=>(a.ate==null?null:a.ate);
const naTurmaEm=(a,per)=>entrou(a)<=per && (saiu(a)==null || saiu(a)>=per);
const ativo=a=>saiu(a)==null;
function alunosEm(t,per){ return (t.alunos||[]).filter(a=>naTurmaEm(a,per)); }
function temNotas(t,a){ return E.res.some(r=>r.turma===t.id && r.numero===a.numero); }

/* ── gabarito individual, a partir do canônico + turma/número ───── */
function gabaritoDe(nomeTurma,numero){
  const p=provaAtiva(); if(!p||!p.gabC) return null;
  const {oq,oa}=embaralharProva(p.nq,p.no,nomeTurma,numero);
  let g="";
  for(let i=0;i<p.nq;i++){
    const certa=LAY.options.indexOf(p.gabC[oq[i]]);
    g+=LAY.options[oa[i].indexOf(certa)];
  }
  return g;
}
function canonizar(R,nomeTurma,numero){
  const p=provaAtiva(); if(!p) return R.slice();
  const {oq,oa}=embaralharProva(p.nq,p.no,nomeTurma,numero);
  const out=new Array(p.nq).fill(null);
  for(let i=0;i<p.nq;i++){
    if(!R[i]) continue;
    const k=LAY.options.indexOf(R[i]);
    if(k>=0) out[oq[i]]=LAY.options[oa[i][k]];
  }
  return out;
}

/* Refaz as contas de todos os registros de uma prova a partir das
   respostas já lidas. Serve para quando o gabarito estava errado: as
   marcações do papel continuam válidas, só a conferência muda. */
function recalcular(pr){
  const t=turmaDe(pr.turma); if(!t) return 0;
  const letras=["A","B","C","D","E"].slice(0,pr.no);
  let n=0;
  E.res.filter(r=>r.prova===pr.id).forEach(r=>{
    const {oq,oa}=embaralharProva(pr.nq,pr.no,t.nome,r.numero);
    let gab="";
    for(let i=0;i<pr.nq;i++){
      const certa=letras.indexOf(pr.gabC[oq[i]]);
      gab+=letras[oa[i].indexOf(certa)];
    }
    const Rc=new Array(pr.nq).fill(null);
    for(let i=0;i<pr.nq;i++){
      if(!r.R[i]) continue;
      const k=letras.indexOf(r.R[i]);
      if(k>=0) Rc[oq[i]]=letras[oa[i][k]];
    }
    let acertos=0; const certas=[],erradas=[];
    for(let i=0;i<pr.nq;i++){
      if(r.R[i]&&r.R[i]===gab[i]){acertos++;certas.push(i+1);} else erradas.push(i+1);
    }
    r.gab=gab; r.Rc=Rc; r.acertos=acertos; r.erros=pr.nq-acertos;
    r.certas=certas; r.erradas=erradas;
    r.notaDisc=Math.max(0,Math.min(pontosDisc(pr),r.notaDisc||0));
    r.nota=notaFinal(pr,r); n++;
  });
  return n;
}

/* ═════════ 4. REGISTRO ═════════ */
function registrar(d){
  const p=provaAtiva(); if(!p) return null;
  const t=turmaDe(p.turma);
  const gab=d.gab||gabaritoDe(t.nome,d.numero);
  if(!gab) return null;
  let acertos=0; const certas=[],erradas=[];
  for(let i=0;i<p.nq;i++){
    if(d.R[i]&&d.R[i]===gab[i]){acertos++;certas.push(i+1);} else erradas.push(i+1);
  }
  const reg={prova:p.id,turma:p.turma,numero:d.numero||"",nome:d.nome,
    R:d.R.slice(),Rc:canonizar(d.R,t.nome,d.numero),gab,
    acertos,erros:p.nq-acertos,certas,erradas,
    notaDisc:Math.max(0,Math.min(pontosDisc(p),d.notaDisc||0)),
    origem:d.origem,t:Date.now()};
  reg.nota=notaFinal(p,reg);
  const k=chave(reg), i=E.res.findIndex(x=>chave(x)===k);
  if(i>=0) E.res[i]=reg; else E.res.push(reg);
  salvar(); pintarResultados(); pintarDesempenho();
  return reg;
}
const pct=(a,b)=>b?Math.round(100*a/b):0;
const pontosObj=p=>(p&&p.pontosObj!=null)?p.pontosObj:10;
const pontosDisc=p=>(p&&p.pontosDisc)?p.pontosDisc:0;
/* nota final = parte objetiva proporcional aos acertos + nota digitada da parte escrita */
function notaFinal(p,reg){
  const obj=p.nq?pontosObj(p)*reg.acertos/p.nq:0;
  return obj+(reg.notaDisc||0);
}
const notaMaxima=p=>pontosObj(p)+pontosDisc(p);

/* Extrai o texto de um PDF no próprio aparelho, preservando as linhas.
   Serve tanto para a prova quanto para a lista de estudantes. */
let workerPdfPronto=null;

/* O pdf.js cria o worker a partir de uma URL. Offline, se essa URL não
   estiver guardada, ele falha com "Setting up fake worker failed".
   Buscar o arquivo antes e transformá-lo em blob resolve: o worker passa
   a nascer de bytes que já temos na mão. */
async function prepararWorkerPdf(){
  if(workerPdfPronto) return workerPdfPronto;
  workerPdfPronto=(async()=>{
    try{
      const r=await fetch("pdf.worker.min.js");
      if(!r.ok) throw new Error("HTTP "+r.status);
      const b=await r.blob();
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(b);
      return true;
    }catch(e){
      console.warn("worker do pdf via blob falhou, usando o caminho direto",e);
      pdfjsLib.GlobalWorkerOptions.workerSrc="pdf.worker.min.js";
      return false;
    }
  })();
  return workerPdfPronto;
}

async function abrirPdf(arquivo){
  if(typeof pdfjsLib==="undefined") throw new Error("faltou o arquivo pdf.min.js");
  await prepararWorkerPdf();
  const dados=new Uint8Array(await arquivo.arrayBuffer());
  const limite=new Promise((_,rej)=>setTimeout(()=>rej(new Error(
    "a leitura do PDF não respondeu — confira se o arquivo pdf.worker.min.js "+
    "foi enviado junto com o app")),25000));
  /* Sem os arquivos de fonte padrão, um PDF que não embute suas fontes
     é renderizado SEM TEXTO — e as tabelas sairiam recortadas vazias. */
  return await Promise.race([pdfjsLib.getDocument({
    data:dados,
    standardFontDataUrl:"standard_fonts/",
    useSystemFonts:false
  }).promise, limite]);
}

/* Texto e figuras, página a página.

   As figuras não são procuradas como imagens embutidas: muitos PDFs
   desenham gráficos em vetor, sem imagem nenhuma. Em vez disso o app
   procura VÃOS grandes entre linhas de texto — é ali que a figura está —,
   renderiza a página e recorta a faixa. Funciona nos dois casos. */
const VAO_MINIMO = 45;     // pontos de espaço vertical que denunciam uma figura
const ESCALA_FIG = 2;      // resolução do recorte
const FOLGA_FIG = 5;       // afasta o recorte das linhas de texto vizinhas

async function conteudoDePdf(arquivo){
  const doc=await abrirPdf(arquivo);
  const paginas=[], figuras=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const c=await pg.getTextContent();

    // agrupa os pedaços em linhas, guardando altura para medir os vãos
    const linhas=[];
    c.items.forEach(it=>{
      const y=it.transform[5], h=it.height||10;
      const u=linhas[linhas.length-1];
      if(u && Math.abs(u.y-y)<=3){ u.txt+=it.str; u.h=Math.max(u.h,h); }
      else linhas.push({y, h, txt:it.str});
    });

    const bandas=[];

    // 1) vãos grandes = gráfico, esquema ou desenho
    for(let k=0;k<linhas.length-1;k++){
      const vao=linhas[k].y-(linhas[k+1].y+linhas[k+1].h);
      if(vao>=VAO_MINIMO)
        bandas.push({tipo:"figura", depois:k, engole:[],
          de:linhas[k+1].y+linhas[k+1].h+FOLGA_FIG,
          ate:linhas[k].y-FOLGA_FIG});
    }

    // 2) blocos de linhas tabulares = tabela; vira imagem, com as bordas
    let k=0;
    while(k<linhas.length){
      if(!pareceTabela(linhas[k].txt)){ k++; continue; }
      let fim=k;
      while(fim+1<linhas.length && pareceTabela(linhas[fim+1].txt)) fim++;
      if(fim>k){                                   // pelo menos duas linhas
        let ini=k;
        // puxa o cabeçalho da tabela, que costuma não ter números
        if(ini>0){
          const acima=String(linhas[ini-1].txt).trim();
          if(acima.split(/\s+/).length<=6 && acima.length<=60 && !/[:.]$/.test(acima)) ini--;
        }
        bandas.push({tipo:"tabela", depois:ini-1, engole:[ini,fim],
          de:linhas[fim].y-linhas[fim].h*0.4-FOLGA_FIG,
          ate:linhas[ini].y+linhas[ini].h+FOLGA_FIG});
      }
      k=fim+1;
    }

    let recortes=[];
    if(bandas.length) recortes=await recortarFiguras(pg, bandas);

    const engolidas=new Set();
    bandas.forEach((b,j)=>{ if(recortes[j] && b.engole.length)
      for(let x=b.engole[0];x<=b.engole[1];x++) engolidas.add(x); });

    // monta as linhas de texto intercalando a marca da figura no lugar certo
    const saida=[];
    bandas.forEach((b,j)=>{ if(b.depois<0 && recortes[j]){
      figuras.push(recortes[j]); saida.push(MARCA_FIG+(figuras.length-1)); }});
    linhas.forEach((L,idx)=>{
      const t=String(L.txt).trim();
      if(t && !engolidas.has(idx)) saida.push(t);
      bandas.forEach((b,j)=>{
        if(b.depois===idx && recortes[j]){
          figuras.push(recortes[j]);
          saida.push(MARCA_FIG+(figuras.length-1));
        }
      });
    });
    paginas.push({linhas:saida, imagens:[]});
  }
  return {paginas, figuras};
}

async function recortarFiguras(pg, bandas){
  const saida=[];
  try{
    const vp=pg.getViewport({scale:ESCALA_FIG});
    const cv=document.createElement("canvas");
    cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height);
    const cx=cv.getContext("2d");
    cx.fillStyle="#ffffff"; cx.fillRect(0,0,cv.width,cv.height);
    const tarefa=pg.render({canvasContext:cx, viewport:vp});
    const ok=await comLimite(tarefa.promise.then(()=>true), 20000, false);
    if(!ok) return saida;
    const alturaPdf=vp.viewBox[3];
    bandas.forEach(b=>{
      const yTopo=Math.max(0, Math.floor((alturaPdf-b.ate)*ESCALA_FIG));
      const yBase=Math.min(cv.height, Math.ceil((alturaPdf-b.de)*ESCALA_FIG));
      if(yBase-yTopo<20){ saida.push(null); return; }
      const faixa=document.createElement("canvas");
      faixa.width=cv.width; faixa.height=yBase-yTopo;
      faixa.getContext("2d").drawImage(cv,0,yTopo,cv.width,faixa.height,0,0,cv.width,faixa.height);
      saida.push(apararBranco(faixa));
    });
  }catch(e){ console.warn("recorte de figura falhou",e); }
  return saida;
}

/* Corta o branco em volta e devolve no formato que o gerador usa. */
function apararBranco(cv){
  const cx=cv.getContext("2d"), w=cv.width, h=cv.height;
  let d;
  try{ d=cx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  let x0=w, y0=h, x1=-1, y1=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    if(d[i]<245 || d[i+1]<245 || d[i+2]<245){
      if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y;
    }
  }
  if(x1<0 || (x1-x0)<40 || (y1-y0)<18) return null;   // vão em branco de verdade
  const m=6;
  x0=Math.max(0,x0-m); y0=Math.max(0,y0-m);
  x1=Math.min(w-1,x1+m); y1=Math.min(h-1,y1+m);
  let lw=x1-x0+1, lh=y1-y0+1;
  const esc=Math.min(1, 900/Math.max(lw,lh));
  const out=document.createElement("canvas");
  out.width=Math.round(lw*esc); out.height=Math.round(lh*esc);
  const ox=out.getContext("2d");
  ox.fillStyle="#ffffff"; ox.fillRect(0,0,out.width,out.height);
  ox.drawImage(cv,x0,y0,lw,lh,0,0,out.width,out.height);
  try{ return {dados:out.toDataURL("image/jpeg",0.8), w:out.width, h:out.height}; }
  catch(e){ return null; }
}

function comLimite(promessa, ms, padrao){
  return Promise.race([promessa, new Promise(r=>setTimeout(()=>r(padrao), ms))]);
}

async function textoDePdf(arquivo){
  const {paginas}=await conteudoDePdf(arquivo);

}

               <b>${p.nq}</b>. Você pode usar assim mesmo e ajustar, ou mandar para a IA abaixo.`
               :`Reconheci só <b>${achadas.questoes.length}</b> questões — o documento pode não
                 estar no formato numerado. Tente a leitura por IA abaixo.`)}
    </div>
    <button class="btn${bate?"":" gho"}" id="bDireto" style="margin-top:9px">Usar o texto do arquivo</button>
    ${iaImagens.length?`<p class="hint">${iaImagens.length===1?"A imagem encontrada no documento fica guardada"
      :"As "+iaImagens.length+" imagens do documento ficam guardadas"}
      para você anexar em “Figuras das questões”.</p>`:""}`;
  // entrega o texto JÁ normalizado: o que aparece no editor é o que será salvo
  $("#bDireto").onclick=()=>{
    const achadas=lerQuestoes(iaTextoDoc);
    if(iaFiguras) casarFiguras(achadas.questoes, iaFiguras);
    iaFiguradas=achadas.questoes.map(q=>q.imagem||null);
    const no=p?p.no:Math.max(4,Math.min(5,
      achadas.questoes.reduce((m,q)=>Math.max(m,(q.alternativas||[]).length),5)));
    entregarLeitura(questoesParaTexto(achadas.questoes)||iaTextoDoc, p, no); };
}

function extrairJson(txt){
  let t=String(txt||"").trim().replace(/^```(?:json)?/i,"").replace(/```$/,"").trim();
  const i=t.indexOf("{"), j=t.lastIndexOf("}");
  if(i<0||j<i) throw new Error("não encontrei um JSON na resposta");
  return JSON.parse(t.slice(i,j+1));
}
function jsonParaTexto(dados,no){
  const qs=(dados.questoes||dados||[]);
  if(!Array.isArray(qs)||!qs.length) throw new Error("o JSON não trouxe questões");
  return qs.map((q,i)=>{
    const alts=(q.alternativas||[]).slice(0,no).map((a,k)=>
      ((q.correta===k)?"*":"")+"ABCDE"[k]+") "+String(a).trim());
    return (i+1)+". "+String(q.enunciado||"").trim()+(alts.length?"\n"+alts.join("\n"):"");
  }).join("\n\n");
}
function aplicarJson(txt,p){
  try{
    const dados=extrairJson(txt);
    const no=p?p.no:alternativasDe(dados);
    entregarLeitura(jsonParaTexto(dados,no),p,no);
  }catch(e){
    $("#iaErro").innerHTML=`<div class="aviso" style="margin-top:10px">Não consegui usar: ${esc(e.message)}</div>`;
  }
}

let iaTexto=null;      // texto vindo da leitura
let iaTextoPara=null;  // para QUAL prova ele foi lido ("novo" = cadastro em criação)
function descartarLeitura(){
  iaTexto=null; iaTextoPara=null; iaArquivo=null; iaTextoDoc=null;
  iaImagens=[]; iaFiguras=null;

const alternativasDe=d=>{
  const qs=(d&&d.questoes)||d||[];
  const m=(qs||[]).reduce((x,q)=>Math.max(x,((q.alternativas)||[]).length),0);
  return m>=5?5:(m>=4?4:5);
};

/* Se já existe prova, o texto vai para a revisão dela. Se não existe,
   vai para o cadastro com número de questões, alternativas e gabarito
   já preenchidos pela leitura — que é o caminho de quem começa do arquivo. */
function entregarLeitura(texto,p,no){
  iaTexto=texto; iaTextoPara=p?p.id:"novo";
  if(p && !substituindo){ casaNivel="questoes"; montarCasa(); return; }

  casaForm={codigo:velha?velha.codigo:"", titulo:velha?velha.titulo:"",
    nq:Math.max(5,Math.min(30,lidas.questoes.length||10)),
    no:no||5, gab:lidas.gabarito.indexOf("?")<0?lidas.gabarito:"",
    habs:velha?(velha.habs||[]).join("\n"):"",
    po:velha?pontosObj(velha):10, pd:velha?pontosDisc(velha):0,
    per:velha?(velha.periodo||1):ultimoPeriodo, vindoDeArquivo:true,
    substitui:substituindo||null};
  iaTextoPara="novo";
  casaNivel="nova"; montarCasa();
}

  const alvo=$("#iaStatus");

  if(!iaArquivo && !iaTextoDoc){
    st.innerHTML='<div class="aviso" style="margin-top:10px">Escolha o arquivo primeiro.</div>'; return; }
  if(navigator.onLine===false){

  st.innerHTML='<div class="diag" style="margin-top:10px">Enviando para a Claude…</div>';

  const bloco = iaTextoDoc
    ? {type:"text",text:"Conteúdo do documento:\n\n"+iaTextoDoc}

        : {type:"image",source:{type:"base64",media_type:iaArquivo.tipo,data:iaArquivo.b64}});

        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:lerModelo(),max_tokens:8000,

  }

/* ── figuras: uma por questão, comprimidas antes de guardar ─────── */
const FIG_LADO=760, FIG_QUALIDADE=0.72;

function comprimirImagem(arquivo){
  return new Promise((ok,erro)=>{
    const url=URL.createObjectURL(arquivo), im=new Image();
    im.onload=()=>{
      const e=Math.min(1,FIG_LADO/Math.max(im.width,im.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(im.width*e));
      c.height=Math.max(1,Math.round(im.height*e));
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      try{ ok({dados:c.toDataURL("image/jpeg",FIG_QUALIDADE),w:c.width,h:c.height}); }
      catch(x){ erro(new Error("não consegui converter a imagem")); }
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); erro(new Error("arquivo de imagem inválido")); };
    im.src=url;
  });
}

/* ── discursivas: ficam fora do cartão, com nota digitada ───────── */
function lerDiscursivas(txt){
  const out=[]; let atual=null;
  String(txt).split(/\r?\n/).forEach(l=>{
    const t=l.trim(); if(!t){ return; }
    const m=/^(\d{1,2})\s*[.)\-–]\s*(.*)$/.exec(t);
    if(m){ atual={enunciado:m[2].trim(),pontos:null,linhas:4}; out.push(atual); return; }
    const mp=/^\[(\d+(?:[.,]\d+)?)\s*(?:pt|pts|pontos?)?\s*(?:,\s*(\d+)\s*linhas?)?\]$/i.exec(t);
    if(mp && atual){ atual.pontos=parseFloat(mp[1].replace(",","."));
      if(mp[2]) atual.linhas=parseInt(mp[2],10); return; }
    if(atual) atual.enunciado+=" "+t;
    else out.push(atual={enunciado:t,pontos:null,linhas:4});
  });
  return out;
}
function discursivasParaTexto(ds){
  return (ds||[]).map((q,i)=>(i+1)+". "+q.enunciado+
    "\n["+(q.pontos!=null?q.pontos:"")+" pt, "+(q.linhas||4)+" linhas]").join("\n\n");
}

    <textarea id="txD" spellcheck="false" style="min-height:220px"

2. Um terreno retangular tem 12 m por 8 m. Calcule a área e mostre os cálculos.

      $("#dAviso").innerHTML=`<div class="aviso" style="margin-top:10px">

}

      if(!r) return null;
      const nf=(r.nota!=null?r.nota:notaFinal(p,r));
      return 10*nf/notaMaxima(p);           // tudo na mesma escala de 0 a 10
    });
    const val=notas.filter(x=>x!=null);
    const media=val.length?val.reduce((s,x)=>s+x,0)/val.length:null;
    return {aluno:a,notas,media,faltam:notas.filter(x=>x==null).length};
  });
  const cores=v=>v>=6?"var(--mint)":v>=4?"var(--amber)":"var(--coral)";
  h+=`<div class="rot">${comNota.map(p=>esc(p.codigo)).join("  ·  ")}</div>`;

          ${L.faltam?` · <span style="color:var(--amber)">${L.faltam} sem nota</span>`:""}</div></div>
      <div class="nt" style="color:${L.media==null?"var(--mute)":cores(L.media)}">${
        L.media==null?"—":L.media.toFixed(1).replace(".",",")}</div></div>`).join("");
  const medias=linhas.map(L=>L.media).filter(x=>x!=null);
  if(medias.length){
    const m=medias.reduce((s,x)=>s+x,0)/medias.length;
    h+=`<div class="kpi" style="margin-top:16px">
      <div><div class="v">${m.toFixed(1).replace(".",",")}</div><div class="l">Média da turma</div></div>
      <div><div class="v">${medias.filter(x=>x>=6).length}<span style="font-size:13px;color:var(--mute)">/${medias.length}</span></div><div class="l">≥ 6,0</div></div>
      <div><div class="v">${linhas.filter(L=>L.faltam).length}</div><div class="l">Com pendência</div></div>

let ultimaConferencia=null;

function montarOffline(){
  const c=$("#offEstado"); if(!c) return;
  if(!("serviceWorker" in navigator)){
    c.innerHTML='<div class="aviso">Este navegador não guarda o app para uso offline.</div>'; return; }
  const r=ultimaConferencia;
  if(!r){ c.innerHTML='<p class="hint" style="margin-top:0">Toque em verificar para conferir '+
    'se todas as peças do app estão guardadas no aparelho.</p>'; return; }
  if(!r.faltando.length){
    c.innerHTML=`<div class="diag"><b>Tudo guardado</b>${r.total} arquivos no aparelho
      (${esc(r.versao||"")}). O app abre e funciona sem internet.</div>`;
    return; }
  const abre=!r.faltando.some(f=>/index\.html|layout|embaralho|gerador|fonte\.js|jsqr|jspdf|qrcode|\.\/$/.test(f));
  c.innerHTML=`<div class="aviso"><b>${r.faltando.length} de ${r.total} não foram guardados</b>
    ${abre?"O app <b>abre</b> sem internet; o que falta afeta só a leitura de prova por arquivo."
          :"Faltam peças essenciais — o app pode não abrir sem internet."}<br><br>
    ${r.faltando.map(f=>esc(f.replace("./",""))).join(", ")}<br><br>
    ${navigator.onLine?"Toque em verificar de novo para baixar o que falta."
      :"Conecte-se à internet e toque em verificar."}</div>`;
}

function verificarOffline(){
  const c=$("#offEstado");
  if(!navigator.serviceWorker || !navigator.serviceWorker.controller){
    if(c) c.innerHTML='<div class="aviso">O app ainda não foi guardado. '+
      'Conecte-se à internet, recarregue a página e tente de novo.</div>';
    return; }
  if(c) c.innerHTML='<div class="diag">Conferindo…</div>';
  navigator.serviceWorker.controller.postMessage(navigator.onLine?"completar":"conferir");
}

if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", ev=>{
    const d=ev.data||{};
    if(d.tipo==="conferencia"){ ultimaConferencia=d; montarOffline(); }
    if(d.tipo==="extras" && d.falhas && d.falhas.length){
      console.warn("[sw] extras que faltaram:", d.falhas);
      avisoFlutuante('<b>Uso offline incompleto</b>'+d.falhas.length+
        ' arquivo(s) não foram baixados. O app abre sem internet, mas ler prova '+
        'de PDF ou Word pode falhar. Configurações › Verificar uso offline.',"aviso",9);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════════
   CÓPIA DE SEGURANÇA
   Como não existe servidor, o arquivo exportado é a única cópia que
   sobrevive à perda do aparelho.
   ═══════════════════════════════════════════════════════════════════ */
const ULTIMO_BACKUP="dbm_ultimo_backup";

function resumoDados(){
  const turmas=(E.turmas||[]).filter(t=>(t.alunos||[]).length).length;
  const alunos=(E.turmas||[]).reduce((n,t)=>n+(t.alunos||[]).length,0);
  const figuras=(E.provas||[]).reduce((n,p)=>n+((p.questoes||[]).filter(q=>q.imagem).length),0);
  return {turmas, alunos, provas:(E.provas||[]).length,
          notas:(E.res||[]).length, figuras,
          kb:Math.round(espacoUsado()/1024)};
}

function montarBackup(){
  const c=$("#bkResumo"); if(!c) return;
  const r=resumoDados();
  const q=guarda.ler(ULTIMO_BACKUP);
  const dias=q?Math.floor((Date.now()-Number(q))/86400000):null;
  const alerta=(r.notas>0 && (dias===null || dias>=30));
  c.innerHTML=`<div class="${alerta?"aviso":"diag"}">
    ${alerta?"<b>Sem cópia recente</b>":"<b>Seus dados</b>"}
    ${r.turmas} turma${r.turmas===1?"":"s"} com estudantes · ${r.alunos} estudantes ·
    ${r.provas} prova${r.provas===1?"":"s"} · ${r.notas} nota${r.notas===1?"":"s"} ·
    ${r.figuras} figura${r.figuras===1?"":"s"} · ${r.kb} KB<br>
    ${q?("Última cópia: "+new Date(Number(q)).toLocaleDateString("pt-BR")+
        (dias?" ("+dias+" dia"+(dias===1?"":"s")+" atrás)":" (hoje)"))
      :"Nenhuma cópia baixada até agora."}</div>`;
}

function baixarBackup(){
  const pacote={
    formato:"desbugando-omr",
    versao:E.v||5,
    gerado:new Date().toISOString(),
    professor:lerProfessor(),
    dados:E                      // a chave de API fica de fora, de propósito
  };
  const hoje=new Date().toISOString().slice(0,10);
  baixar(JSON.stringify(pacote), "backup_provas_"+hoje+".json", "application/json");
  guarda.esc(ULTIMO_BACKUP, String(Date.now()));
  montarBackup();
}

function validarBackup(txt){
  const d=JSON.parse(txt);
  const E2=d && (d.dados||d);
  if(!E2 || !Array.isArray(E2.turmas) || !Array.isArray(E2.provas))
    throw new Error("este arquivo não é uma cópia do app");
  return E2;
}

/* Juntar preserva o que existe aqui e acrescenta o que veio de fora.
   Em conflito de nota, vence a mais recente. */
function juntarBackup(E2){
  const porId=(lista,novos)=>{
    const mapa={}; lista.forEach(x=>mapa[x.id]=x);
    (novos||[]).forEach(x=>{ if(!mapa[x.id]) lista.push(x); });
    return lista;
  };
  porId(E.escolas, E2.escolas);
  (E2.turmas||[]).forEach(t2=>{
    const t=E.turmas.find(x=>x.id===t2.id || x.nome===t2.nome);
    if(!t){ E.turmas.push(t2); return; }
    (t2.alunos||[]).forEach(a2=>{
      if(!t.alunos.some(a=>a.numero===a2.numero)) t.alunos.push(a2); });
    t.alunos.sort((a,b)=>ordNum(a.numero,b.numero));
    if(!t.periodo && t2.periodo) t.periodo=t2.periodo;
  });
  porId(E.provas, E2.provas);
  (E2.res||[]).forEach(r2=>{
    const i=E.res.findIndex(r=>chave(r)===chave(r2));
    if(i<0) E.res.push(r2);
    else if((r2.t||0)>(E.res[i].t||0)) E.res[i]=r2;
  });
}

/* ── questões: aceita o formato que o professor já digita ────────── */
/* Cabeçalho e rodapé se repetem em todas as páginas; linhas de
   habilidade e numeração de página não fazem parte da questão. */
function limparRuidoProva(paginas){
  /* Só as bordas da página podem ser cabeçalho ou rodapé. Olhar o miolo
     apagaria alternativas parecidas entre si — "A) f(x) = 3x + 6" e
     "A) f(x) = 5x + 4" viram a mesma coisa depois de trocar os números. */
  const BORDA=2;
  const conta={};
  paginas.forEach(p=>{
    const bordas=[...p.linhas.slice(0,BORDA), ...p.linhas.slice(-BORDA)];
    new Set(bordas).forEach(l=>{
      const chave=l.replace(/\d+/g,"#").trim();
      conta[chave]=(conta[chave]||0)+1;
    });
  });
  const minimo=Math.max(2,Math.ceil(paginas.length*0.6));
  const repetida=(l,i,total)=>{
    if(i>=BORDA && i<total-BORDA) return false;
    const chave=l.replace(/\d+/g,"#").trim();
    return chave.length>12 && conta[chave]>=minimo;
  };
  const lixo=[
    /^\s*habilidade\b/i,
    /^\s*p[áa]gina\s*\d+\s*$/i,
    /^\s*\d+\s*$/,
    /^\s*coment[áa]rios?\s+das\s+respostas/i
  ];
  return paginas.map(p=>({
    imagens:p.imagens,
    linhas:p.linhas.filter((l,i,arr)=>{
      if(repetida(l,i,arr.length)) return false;
      return !lixo.some(re=>re.test(l));
    })
  }));
}

/* Linhas de tabela (muitos números soltos) precisam continuar em
   linhas próprias, senão viram uma frase ilegível. */
function pareceTabela(l){
  const t=String(l).trim();
  if(!t) return false;
  // alternativa ou enunciado numerado nunca é linha de tabela —
  // "A) R$ 12,00" e "A) 20%" enganavam a regra e sumiam da prova
  if(/^\*?\s*[A-Ea-e]\s*[).\-–]\s/.test(t)) return false;
  if(/^\d{1,2}\s*[.)\-–]\s/.test(t)) return false;
  const toks=t.split(/\s+/);
  const nums=toks.filter(x=>/^-?[\d.,]+%?$/.test(x)).length;
  // linha com vários números soltos: "Tempo (h) 1 2 3 4"
  if(toks.length>=3 && nums>=3 && nums/toks.length>=0.4) return true;
  // linha curta terminando em número: "Ônibus 80", "A pé 60"
  if(toks.length<=4 && nums>=1 && /[\d]$|[\d]%$/.test(t) && t.length<=28) return true;
  return false;
}

/* Muitas provas trazem o gabarito no fim, em bloco. Ele precisa ser
   separado ANTES de ler as questões: senão "01. B  02. C" vira questão. */
function separarGabarito(txt){
  const linhas=String(txt).split(/\r?\n/);
  const marca=/^\s*(gabarito|respostas?|chave\s+de\s+respostas?|folha\s+de\s+respostas?)\s*:?\s*$/i;
  let i=linhas.findIndex(l=>marca.test(l));
  if(i<0){                                   // às vezes vem com texto na mesma linha
    i=linhas.findIndex(l=>/^\s*(gabarito|respostas)\b/i.test(l) &&
      /\d{1,2}\s*[).:\-–]?\s*[A-Ea-e]\b/.test(l));
  }
  if(i<0) return {corpo:txt, chave:null};
  const bloco=linhas.slice(i);
  const chave={};

  // formato de tabela: uma linha com os números, outra com as letras
  for(let k=0;k<bloco.length-1;k++){
    const a=bloco[k].trim(), b=bloco[k+1].trim();
    if(!/^(quest[ãa]o|item|n[ºo°]?)\b/i.test(a)) continue;
    if(!/^(resposta|gabarito|alternativa)/i.test(b)) continue;
    const nums=(a.match(/\d{1,2}/g)||[]).map(Number);
    const letras=(b.match(/\b[A-Ea-e]\b/g)||[]).map(x=>x.toUpperCase());
    if(nums.length && nums.length===letras.length){
      nums.forEach((n,idx)=>chave[n]=letras[idx]);
      break;
    }
  }

  // formato em lista: 01. B  /  1) C  /  1-B
  if(!Object.keys(chave).length){
    const re=/(\d{1,2})\s*[).:\-–]?\s*([A-Ea-e])(?![A-Za-zÀ-ÿ0-9])/g;
    let m; while((m=re.exec(bloco.join("\n")))) if(chave[+m[1]]==null) chave[+m[1]]=m[2].toUpperCase();
  }
  if(!Object.keys(chave).length) return {corpo:txt, chave:null};
  return {corpo:linhas.slice(0,i).join("\n"), chave};
}

/* Marca de página invisível ao professor, usada só para casar figuras. */
const MARCA_PAG="\u0001PAG";
const MARCA_FIG="\u0001FIG";

function lerQuestoes(txtBruto){
  const {corpo:txt, chave}=separarGabarito(txtBruto);
  const questoes=[]; let gab="", atual=null, ultimaAlt=null, alvo=null;
  let paginaAtual=0;
  let linhas=String(txt).split(/\r?\n/);
  // descarta cabeçalho/instruções antes da primeira questão numerada,
  // senão o título do documento vira uma questão fantasma
  const inicio=linhas.findIndex(l=>/^\s*\d{1,2}\s*[.)\-–]\s*\S/.test(l));
  if(inicio>0) linhas=linhas.slice(inicio);
  linhas.forEach(linha=>{
    const l=linha.trim();
    if(l.indexOf(MARCA_PAG)===0){ paginaAtual=parseInt(l.slice(MARCA_PAG.length),10)||0; return; }
    if(l.indexOf(MARCA_FIG)===0){
      const n=parseInt(l.slice(MARCA_FIG.length),10);
      if(atual && !isNaN(n) && atual.figIdx==null) atual.figIdx=n;
      return; }
    if(!l){ alvo=null; return; }
    const mq=/^(\d{1,2})\s*[.)\-–]\s*(.*)$/.exec(l);
    const ma=/^(\*?)\s*([A-Ea-e])\s*[).\-–]\s+(.*)$/.exec(l);
    if(ma && atual){
      const k=ma[2].toUpperCase().charCodeAt(0)-65;
      while(atual.alternativas.length<k) atual.alternativas.push("");
      atual.alternativas[k]=ma[3].trim();
      if(ma[1]==="*") atual.correta=k;
      ultimaAlt=k; alvo="alt"; return;
    }
    if(mq && (!atual || atual.alternativas.length)){
      atual={enunciado:mq[2].trim(),alternativas:[],correta:null,pagina:paginaAtual};
      questoes.push(atual); ultimaAlt=null; alvo="enun"; return;
    }
    if(atual && alvo==="alt" && ultimaAlt!==null){
      atual.alternativas[ultimaAlt]+=" "+l; return; }
    if(atual && alvo==="enun"){
      const ultima=atual.enunciado.split("\n").pop();
      atual.enunciado += ((pareceTabela(l)||pareceTabela(ultima)) ? "\n" : " ") + l;
      return; }
    if(!atual){ atual={enunciado:l,alternativas:[],correta:null,pagina:paginaAtual};
      questoes.push(atual); alvo="enun"; }
  });
  if(chave) questoes.forEach((q,i)=>{
    const letra=chave[i+1];
    if(letra && q.correta==null){
      const k="ABCDE".indexOf(letra);
      if(k>=0 && k<Math.max(q.alternativas.length,5)) q.correta=k;
    }
  });
  const limpar=t=>String(t==null?"":t).split(MARCA_PAG)[0].replace(/\s+$/,"");
  questoes.forEach(q=>{
    q.enunciado=limpar(q.enunciado);
    q.alternativas=q.alternativas.map(limpar);
  });
  questoes.forEach(q=>{ gab += (q.correta==null?"?":"ABCDE"[q.correta]); });
  return {questoes,gabarito:gab,doArquivo:!!chave};
}
function questoesParaTexto(qs){
  return (qs||[]).map((q,i)=>{
    const alt=(q.alternativas||[]).map((a,k)=>
      ((q.correta===k)?"*":"")+"ABCDE"[k]+") "+a).join("\n");
    return (i+1)+". "+q.enunciado+(alt?"\n"+alt:"");
  }).join("\n\n");
}

function telaQuestoes(box){
  const p=provaDe(casaProva);

    <textarea id="txQ" spellcheck="false" style="min-height:300px"
      placeholder="1. Dados os conjuntos A = {1,2,3,4} e B = {3,4,5}, determine A ∩ B.
A) {1,2}
*B) {3,4}
C) {5}
D) {1,2,3,4,5}
E) conjunto vazio

2. Um prisma reto tem base quadrada de lado 5 cm e altura 12 cm..."></textarea>
    <div id="qAviso"></div>
    <div class="duo" style="margin-top:11px">
      <button class="btn sec" id="bConferir">Conferir</button>
      <button class="btn" id="bSalvaQ">Salvar questões</button></div>
    <button class="btn gho" id="bLerArq" style="margin-top:9px">Ler de uma foto ou PDF</button>

      então pode colar texto quebrado que o app remonta.</p>`;
  if(iaTexto && iaTextoPara===p.id){ $("#txQ").value=iaTexto; iaTexto=null; iaTextoPara=null;
    $("#qAviso").innerHTML='<div class="aviso">Texto vindo da leitura automática. '+
      'Confira sinais, expoentes e frações antes de salvar — é aqui que a IA erra.</div>';
  } else $("#txQ").value=questoesParaTexto(p.questoes);
  const conferir=()=>{
    const {questoes,gabarito}=lerQuestoes($("#txQ").value);
    const av=[];
    if(questoes.length!==p.nq)
      av.push(`Encontrei <b>${questoes.length}</b> questões, mas a prova foi criada com <b>${p.nq}</b>.`);
    const curtas=questoes.map((q,i)=>q.alternativas.filter(a=>a&&a.trim()).length<p.no?i+1:0).filter(Boolean);
    if(curtas.length) av.push(`Questão ${curtas.join(", ")}: menos de ${p.no} alternativas.`);
    const vazias=questoes.map((q,i)=>!q.enunciado?i+1:0).filter(Boolean);
    if(vazias.length) av.push(`Questão ${vazias.join(", ")}: enunciado vazio.`);
    if(typeof caracteresFaltando==="function"){
      const t=[]; questoes.forEach(q=>{t.push(q.enunciado);q.alternativas.forEach(a=>t.push(a));});
      const fora=caracteresFaltando(t);
      if(fora.length) av.push(`Estes caracteres não existem na fonte e sumiriam da prova: <b>${esc(fora.join(" "))}</b>`);
    }
    const semMarca=gabarito.indexOf("?")>=0;
    const divergiu=!semMarca && questoes.length===p.nq && gabarito!==p.gabC;
    let h="";
    if(av.length) h+=`<div class="aviso">${av.join("<br>")}</div>`;
    if(divergiu)
      h+=`<div class="aviso">Pelas marcações <b>*</b> o gabarito seria <b>${esc(gabarito)}</b>,
          e o cadastrado é <b>${esc(p.gabC)}</b>. Salvar vai usar o das marcações.</div>`;
    if(semMarca && !av.length)
      h+=`<div class="aviso">Nenhuma alternativa marcada com <b>*</b>.
          O gabarito cadastrado (<b>${esc(p.gabC)}</b>) será mantido.</div>`;
    if(!av.length && !semMarca && !divergiu)
      h+=`<div class="diag"><b>Tudo certo</b>${questoes.length} questões, gabarito ${esc(gabarito)}.</div>`;
    $("#qAviso").innerHTML=h;
    return {questoes,gabarito,semMarca};
  };
  $("#txQ").oninput=()=>{ $("#qAviso").innerHTML=""; };
  $("#bConferir").onclick=conferir;
  $("#mVolta").onclick=()=>{casaNivel="prova";montarCasa();};
  $("#bLerArq").onclick=()=>{casaNivel="ler";montarCasa();};
  $("#bSalvaQ").onclick=()=>{
    const {questoes,gabarito,semMarca}=conferir();
    if(!questoes.length){ alert("Não encontrei nenhuma questão no texto."); return; }
    const antigas=p.questoes||[];
    p.questoes=questoes.map((q,i)=>({enunciado:q.enunciado,
      alternativas:q.alternativas.slice(0,p.no),correta:q.correta,
      // a figura fica presa à posição da questão: reeditar o texto não a perde
      imagem:(antigas[i]&&antigas[i].imagem)||(iaFiguradas&&iaFiguradas[i])||null}));
    iaFiguradas=null;
    if(!semMarca && gabarito.length===p.nq) p.gabC=gabarito;
    salvar(); casaNivel="prova"; montarCasa(); };
}

/* ── geração dos PDFs ────────────────────────────────────────────── */
function gerarPDF(p,t,modo){
  const st=$("#pdfStatus");
  const dizer=(cls,txt)=>{ st.innerHTML=`<div class="${cls}" style="margin-top:12px">${txt}</div>`; };
  if(!t.alunos.length){ dizer("aviso","Cadastre os estudantes da turma antes de gerar."); return; }
  if(typeof window.jspdf==="undefined"||typeof qrcode!=="function"){
    dizer("aviso","Faltou carregar jspdf.umd.min.js ou qrcode.min.js. Envie-os para o GitHub."); return; }
  if(modo==="prova" && (p.questoes||[]).length!==p.nq){
    dizer("aviso",`A prova tem ${p.nq} questões, mas só ${(p.questoes||[]).length} foram digitadas.
      Use “Questões da prova”, ou gere só os cartões.`); return; }
  dizer("diag","Montando "+t.alunos.length+" provas…");
  setTimeout(()=>{
    try{
      const e=escolaDe(t.escola);
      const cfg={codigo:p.codigo,titulo:p.titulo,escola:e?e.nome:"",turma:t.nome,
        disciplina:t.disciplina,professor:lerProfessor(),
        periodoLabel:nomePeriodo(t,p.periodo||1),
        gabaritoCanonico:p.gabC,no:p.no,questoes:p.questoes||[],
        discursivas:p.discursivas||[]};
      const doc = (modo==="cartoes")
        ? gerarFolhasDeCartoes(cfg,t.alunos)
        : gerarProvas(cfg,t.alunos,window.jspdf.jsPDF);
      const nome=(modo==="cartoes"?"cartoes_":"provas_")+t.nome+"_"+p.codigo+".pdf";
      doc.save(nome);
      let extra="";
      if(doc.avisoCaracteres&&doc.avisoCaracteres.length)
        extra=`<br><b>Atenção:</b> os caracteres ${esc(doc.avisoCaracteres.join(" "))} não existem na fonte e não foram impressos.`;
      const porAluno=(doc.getNumberOfPages()/Math.max(1,t.alunos.length)).toFixed(0);
      dizer("diag","<b>Pronto</b>"+doc.getNumberOfPages()+" páginas ("+porAluno+
        " por estudante) · corpo "+(doc.corpoUsado||"")+"pt · "+nome+extra);
    }catch(err){ console.error(err); dizer("aviso","Falhou ao gerar: "+err.message); }
  },50);
}

/* várias etiquetas por folha, para quem imprime a prova à parte */
function gerarFolhasDeCartoes(cfg,alunos){
  const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
  prepararFontes(doc);
  const L=montarLayout(String(cfg.gabaritoCanonico).length,cfg.no);
  const alt=L.box_h+2*L.quiet_zone, margem=14, passo=alt+6;
  const porFolha=Math.max(1,Math.floor((297-2*margem)/passo));
  const aviso=(pg)=>{
    doc.setFont("helvetica","normal"); doc.setFontSize(6.5); doc.setTextColor(150,156,166);
    doc.text("Recorte na linha tracejada antes de distribuir — a câmera não lê "+
             "dois cartões na mesma folha.", 12, 8);
  };
  aviso();
  alunos.forEach((a,i)=>{
    if(i && i%porFolha===0){ doc.addPage(); aviso(); }
    const linha=i%porFolha;
    desenharCartao(doc,{x:margem,y:margem+linha*passo,codigo:cfg.codigo,
      gabaritoCanonico:cfg.gabaritoCanonico,no:cfg.no,turma:cfg.turma,
      numero:a.numero,nome:a.nome});
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(120,128,140);
    doc.text(a.numero+" · "+a.nome, margem, margem+linha*passo+alt+1.5);
  });
  return doc;
}

function textoDeArquivo(txt,nome,nomeTurma){
  if(/\.json$/i.test(nome)){
    try{ const d=JSON.parse(txt);
      let al=Array.isArray(d)?d:(d.alunos||[]);
      const desta=al.filter(a=>String(a.turma||"").toUpperCase()===nomeTurma.toUpperCase());
      if(desta.length) al=desta;
      return al.map(a=>(a.numero||"")+" "+(a.nome||"")).join("\n");
    }catch(e){ return txt; }
  }
  return txt;
}
/* Listas de chamada vêm com cabeçalho, rodapé e colunas extras.
   Fica só o que parece nome de estudante. */
function limparListaBruta(txt){
  const fora=new RegExp("(rela[çc][ãa]o|lista|escola|turma|s[ée]rie|disciplina|professor"+
    "|ano letivo|p[áa]gina|total de|n[ºo°]?\\s*ordem|nome do aluno|matr[íi]cula"+
    "|assinatura|data)","i");
  return String(txt).split(/\r?\n/).filter(l=>{
    const t=l.trim();
    if(!t) return false;
    if(t.length<4) return false;
    if(fora.test(t) && !/^\d{1,3}[\s;,.\-]/.test(t)) return false;   // cabeçalho
    if(!/[A-Za-zÀ-ÿ]{3}/.test(t)) return false;                        // sem palavra
    return true;
  }).join("\n");
}
function lerListaAlunos(txt){
  const out=[]; let auto=0;
  String(txt).split(/\r?\n/).forEach(l=>{
    l=l.trim(); if(!l) return;
    let num="",nome=l;
    const m=/^(\d{1,3})\s*[;,\t.\-]?\s+(.+)$/.exec(l);
    if(m){ num=m[1]; nome=m[2]; }
    else { const c=l.split(/[;,\t]/); if(c.length>1&&/^\d{1,3}$/.test(c[0].trim())){
      num=c[0].trim(); nome=c.slice(1).join(" "); } }
    nome=nome.replace(/[;,\t]+/g," ").replace(/\s{2,}/g," ").trim();
    if(!nome||/^\d+$/.test(nome)) return;
    if(!num) num=String(++auto).padStart(2,"0"); else num=num.padStart(2,"0");
    if(out.some(a=>a.numero===num)) num=String(out.length+1).padStart(2,"0");
    out.push({numero:num,nome:nome.toUpperCase(),desde:1,ate:null});
  });
  return out.sort((a,b)=>ordNum(a.numero,b.numero));
}

/* ═══════════════════════════════════════════════════════════════════
   6. CÂMERA
   ═══════════════════════════════════════════════════════════════════ */
const video=$("#video"), over=$("#over"), ctx=over.getContext("2d");
const tmp=document.createElement("canvas"), tctx=tmp.getContext("2d",{willReadFrequently:true});
let stream=null, rodando=false, hist=[], travado=null, ultimoQuad=null, alunoQR=null, semQR=0;
let semCartao=0, giroLayout=0;

async function iniciar(){
  if(!provaAtiva()){ irPara("casa"); return; }
  try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},
    width:{ideal:1280},height:{ideal:960}},audio:false});
  }catch(e){ faixa("Câmera indisponível","Use “Usar foto” ou a aba Manual",true);
    $("#acoes2").style.display="flex"; return; }
  video.srcObject=stream; await video.play();
  rodando=true; hist=[]; travado=null; alunoQR=null; semQR=0; semCartao=0;
  $("#acoes").innerHTML=""; $("#acoes2").style.display="flex"; $("#grade").hidden=false;
  desenhaGrade(null,false); laco();
}
function parar(){
  rodando=false;
  if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null;}
  video.srcObject=null; ctx.clearRect(0,0,over.width,over.height);
  $("#grade").hidden=true; $("#acoes2").style.display="none";
  $("#acoes").innerHTML='<button class="btn" id="bIniciar">Iniciar câmera</button>';
  $("#bIniciar").onclick=iniciar;
  const p=provaAtiva();
  faixa("Câmera parada", p?resDa(p.id).length+" cartões salvos":"Escolha uma prova");
}
function faixa(t,s,al){ $("#ftit").textContent=t; $("#fsub").textContent=s;
  $("#dot").style.background=al?"var(--coral)":(travado?"var(--mint)":"var(--amber)"); }
let falhas=0;
function laco(){
  if(!rodando) return;
  try{
    if(video.readyState>=2 && !travado) processar();
    falhas=0;
  }catch(err){
    console.error("quadro descartado:",err);
    if(++falhas===8) faixa("Erro na leitura","Recarregue a página; confira se todos os arquivos subiram",true);
  }
  setTimeout(()=>requestAnimationFrame(laco),70);
}
function processar(){
  const vw=video.videoWidth, vh=video.videoHeight; if(!vw) return;
  const alvo=Math.min(1100,vw);
  tmp.width=alvo; tmp.height=Math.round(vh*alvo/vw);
  tctx.drawImage(video,0,0,tmp.width,tmp.height);
  analisar(tctx.getImageData(0,0,tmp.width,tmp.height),true);
}
/* se o cartão some por muito tempo, testa os outros formatos cadastrados —
   resolve o caso de apontar a câmera para a prova errada */
function tentarOutroLayout(){
  const fmts=[];
  E.provas.forEach(p=>{ const k=p.nq+"x"+p.no;
    if(!fmts.some(f=>f.k===k)) fmts.push({k,nq:p.nq,no:p.no}); });
  if(fmts.length<2) return false;
  giroLayout=(giroLayout+1)%fmts.length;
  const f=fmts[giroLayout];
  return aplicarLayout(f.nq,f.no);
}
function analisar(imgData,aoVivo){
  const src=cinza(imgData), quad=fiduciais(reduzir(src,620));
  ultimoQuad=quad;
  if(aoVivo) pintar(quad,imgData.width,imgData.height);
  if(!quad){ hist=[]; desenhaGrade(null,false);
    if(aoVivo && ++semCartao%28===0 && tentarOutroLayout())
      faixa("Ajustando o formato…","Testando outro tamanho de cartão");
    else faixa("Procurando o cartão","Enquadre a moldura tracejada inteira");
    return false; }
  semCartao=0;
  if(!alunoQR){ const p=lerQR(src,quad);
    if(p){ const r=aplicarQR(p);
      if(r==="trocou"){ hist=[]; faixa("Formato ajustado","Mantenha o cartão enquadrado"); return false; }
      if(r) semQR=0; else semQR++;
    } else semQR++; }
  const L=lerBolhas(src,quad); if(!L) return false;
  desenhaGrade(L.R,false);
  if(!alunoQR && semQR<=40){
    faixa("Cartão localizado","Aproxime um pouco para o QR entrar em foco"); return false; }
  if(!alunoQR){ faixa("QR ilegível","Use a aba Manual para este cartão",true); return false; }
  const ch=L.R.join("|"); hist.push(ch); if(hist.length>3) hist.shift();
  if(hist.length===3 && hist[0]===hist[1] && hist[1]===hist[2]){ travar(L); return true; }
  faixa("Lendo "+primeiroNome(alunoQR.nome)+"…",
        alunoQR.turma+" · nº "+alunoQR.numero+" · "+L.R.filter(Boolean).length+"/"+NQ);
  return false;
}
/* DBM2/DBM3 = 10 questões, 5 alternativas.  DBM4 traz a assinatura do layout. */
function aplicarQR(p){
  const t=String(p).split("|");
  if(!/^DBM[234]$/.test(t[0]||"")||t.length<3) return false;
  const g=(t[2]||"").toUpperCase();
  if(!/^[A-E]{5,30}$/.test(g)) return false;
  let nq=g.length, no=5;
  if(t[0]==="DBM4"){ const a=lerAssinatura(t[6]);
    if(a){ nq=a.nq; no=a.no; } }
  if(nq!==g.length) return false;
  const codigo=(t[1]||"").trim();
  const turma=(t[3]||"").trim(), numero=(t[4]||"").trim(), nome=(t[5]||"").trim();
  if(!nome) return false;

  // achar (ou criar) a prova correspondente a este cartão
  let pr=E.provas.find(x=>x.codigo===codigo&&x.nq===nq&&x.no===no)
      || E.provas.find(x=>x.codigo===codigo);
  if(!pr){
    let tu=E.turmas.find(x=>x.nome.toUpperCase()===turma.toUpperCase());
    if(!tu){ tu={id:"t-"+turma,escola:"jc",nome:turma,serie:"—",
      disciplina:"Matemática",alunos:[],periodo:{tipo:"bimestre",qtd:4}};
      E.turmas.push(tu); }
    pr={id:uid("p"),turma:tu.id,codigo:codigo||"PROVA",titulo:"",nq,no,
        gabC:inferirCanonico(g,turma,numero,nq,no),habs:[],criada:Date.now()};
    E.provas.push(pr);
  }
  const trocou=(pr.id!==E.ativa);
  if(trocou){ E.ativa=pr.id; refletirBarra(); }
  const mudouLayout=aplicarLayout(pr.nq,pr.no);

  const tu=turmaDe(pr.turma);
  if(tu&&numero&&!tu.alunos.some(a=>a.numero===numero)){
    tu.alunos.push({numero,nome,desde:1,ate:null}); tu.alunos.sort((a,b)=>ordNum(a.numero,b.numero)); }

  alunoQR={turma:tu?tu.nome:turma,numero,nome,gab:g};
  salvar(); montarManual();
  return mudouLayout?"trocou":true;
}
function inferirCanonico(gabAluno,turma,numero,nq,no){
  const {oq,oa}=embaralharProva(nq,no,turma,numero);
  const letras=["A","B","C","D","E"].slice(0,no);
  const out=new Array(nq).fill(letras[0]);
  for(let i=0;i<nq;i++){
    const k=letras.indexOf(gabAluno[i]);
    if(k>=0) out[oq[i]]=letras[oa[i][k]];
  }
  return out.join("");
}
function pintar(quad,w,h){
  const r=video.getBoundingClientRect(), dpr=devicePixelRatio||1;
  over.width=r.width*dpr; over.height=r.height*dpr;
  over.style.width=r.width+"px"; over.style.height=r.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,r.width,r.height);
  if(!quad) return;
  const e=Math.max(r.width/w,r.height/h), ox=(r.width-w*e)/2, oy=(r.height-h*e)/2;
  ctx.beginPath(); quad.forEach(([x,y],i)=>ctx[i?"lineTo":"moveTo"](x*e+ox,y*e+oy));
  ctx.closePath(); ctx.strokeStyle=travado?"#34D399":"#F97316"; ctx.lineWidth=3.5;
  ctx.setLineDash(travado?[]:[13,9]); ctx.stroke(); ctx.setLineDash([]);
  quad.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x*e+ox,y*e+oy,6,0,6.2832);
    ctx.fillStyle=travado?"#34D399":"#F97316"; ctx.fill(); });
}
function desenhaGrade(R,lk){
  const g=$("#grade");
  if(!g.dataset.pronto){ let h='<span></span>'+LAY.options.map(o=>`<span class="h">${o}</span>`).join("");

      for(let k=0;k<NO;k++) h+=`<i data-q="${q}" data-k="${k}"></i>`; }
    g.innerHTML=h; g.dataset.pronto="1";
    g.style.gridTemplateColumns="auto repeat("+NO+",14px)"; }
  g.querySelectorAll("i").forEach(el=>{
    const on=R && R[+el.dataset.q-1]===LAY.options[+el.dataset.k];
    el.className=on?(lk?"lk":"on"):""; });
}

/* ═════════ 10. ANÁLISE DA TURMA ═════════ */
function estat(A){
  const p=provaAtiva(); if(!A.length||!p) return null;
  const n=A.length, notas=A.map(a=>10*a.acertos/p.nq);     // objetiva, base da análise
  const med=notas.reduce((s,x)=>s+x,0)/n;
  const max=notaMaxima(p);
  const finais=A.map(a=>a.nota!=null?a.nota:notaFinal(p,a));
  const medFinal=finais.reduce((s,x)=>s+x,0)/n;
  const temDisc=pontosDisc(p)>0;
  const item=[], hab={};
  for(let q=0;q<p.nq;q++){
    const ac=A.filter(a=>a.Rc[q]&&a.Rc[q]===p.gabC[q]).length;
    const v=100*ac/n; item.push(v);
    const h=(p.habs[q]||("Questão "+(q+1)));
    (hab[h]=hab[h]||[]).push(v);
  }
  const habs=Object.entries(hab).map(([h,v])=>[h,v.reduce((s,x)=>s+x,0)/v.length])
    .sort((a,b)=>a[1]-b[1]);
  return {n,med,notas,item,habs,nq:p.nq,max,finais,medFinal,temDisc,
    mediaAc:A.reduce((s,a)=>s+a.acertos,0)/n,
    mediaEr:A.reduce((s,a)=>s+a.erros,0)/n,
    aprov:notas.filter(x=>x>=6).length};
}
function diagnostico(s){
  const fracas=s.habs.filter(([,v])=>v<50), fortes=s.habs.filter(([,v])=>v>=75);
  const piores=s.item.map((v,q)=>[q+1,v]).sort((a,b)=>a[1]-b[1]).slice(0,3);
  const melhores=s.item.map((v,q)=>[q+1,v]).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const L=[];
  if(s.temDisc) L.push(`<div class="diag"><b>Sobre estes números</b>A análise por questão e por
    habilidade usa só a parte objetiva, que é onde a leitura é confiável. A parte escrita entra
    apenas na nota final de cada aluno.</div>`);
  L.push(`<div class="diag"><b>Leitura geral</b>Média ${s.med.toFixed(1)} de 10 (${(s.med*10).toFixed(0)}% de aproveitamento), com ${s.aprov} de ${s.n} acima de 6,0. Cada estudante acertou ${s.mediaAc.toFixed(1)} das ${s.nq} questões, em média.</div>`);
  if(fracas.length) L.push(`<div class="diag"><b>Precisa ser retomado</b><ul>${
    fracas.map(([h,v])=>`<li>${esc(h)} — ${Math.round(v)}% de acerto</li>`).join("")}</ul></div>`);
  else L.push(`<div class="diag"><b>Precisa ser retomado</b>Nenhuma habilidade ficou abaixo de 50%. A mais frágil foi ${esc(s.habs[0][0])}, com ${Math.round(s.habs[0][1])}%.</div>`);
  if(fortes.length) L.push(`<div class="diag"><b>Pontos fortes</b><ul>${
    fortes.map(([h,v])=>`<li>${esc(h)} — ${Math.round(v)}%</li>`).join("")}</ul></div>`);
  L.push(`<div class="diag"><b>Questões críticas</b>Menor acerto: ${
    piores.map(([q,v])=>`Q${q} (${Math.round(v)}%)`).join(", ")}. Maior acerto: ${
    melhores.map(([q,v])=>`Q${q} (${Math.round(v)}%)`).join(", ")}.</div>`);
  const rec=[];
  fracas.forEach(([h])=>rec.push(`Retomar <b>${esc(h)}</b> com exercícios dirigidos antes da próxima avaliação.`));
  if(piores[0][1]<40) rec.push(`Resolver a Q${piores[0][0]} passo a passo no quadro — menos de 40% da turma acertou.`);
  if(s.med<5) rec.push("Média abaixo de 5,0: considerar uma aula de revisão geral antes de avançar no conteúdo.");
  if(s.aprov/s.n>0.7) rec.push("Turma majoritariamente acima da média: dá para avançar, atendendo em separado quem ficou abaixo de 4,0.");
  const baixos=s.notas.filter(x=>x<4).length;
  if(baixos) rec.push(`${baixos} estudante(s) abaixo de 4,0 — vale acompanhamento individual.`);
  if(!rec.length) rec.push("Desempenho equilibrado. Seguir o planejamento.");
  L.push(`<div class="diag"><b>Recomendações</b><ul>${rec.map(r=>`<li>${r}</li>`).join("")}</ul></div>`);
  return L.join("");
}
function pintarDesempenho(){
  const p=provaAtiva(), t=turmaAtiva();
  pintarSeletor("desSel", ()=>pintarDesempenho());
  if(!p){ $("#desSub").textContent="";
    $("#desCorpo").innerHTML='<div class="vazio"><b>Nenhuma prova selecionada</b>Escolha a turma e a prova na aba Turmas.</div>'; return; }
  const A=resDa(p.id), s=estat(A);
  if(!s){ $("#desSub").textContent="";
    $("#desCorpo").innerHTML='<div class="vazio"><b>Sem dados ainda</b>As estatísticas aparecem a partir do primeiro cartão corrigido.</div>'; return; }
  $("#desSub").textContent=`${s.n} de ${t.alunos.length||s.n} corrigidos · ${p.codigo} · turma ${t.nome}. Estatísticas parciais, atualizadas a cada correção.`;
  $("#desCorpo").innerHTML=`
    <div class="kpi">
      <div><div class="v">${s.medFinal.toFixed(1).replace(".",",")}</div>
        <div class="l">${s.temDisc?"Média final /"+s.max:"Média"}</div></div>
      <div><div class="v">${(s.med*10).toFixed(0)}%</div><div class="l">Aproveitam. objetiva</div></div>
      <div><div class="v">${s.aprov}<span style="font-size:13px;color:var(--mute)">/${s.n}</span></div><div class="l">≥ 6,0 objetiva</div></div>
      <div><div class="v">${s.mediaAc.toFixed(1)}</div><div class="l">Acertos méd.</div></div>
      <div><div class="v">${s.mediaEr.toFixed(1)}</div><div class="l">Erros méd.</div></div>
      <div><div class="v">${Math.min(...s.notas).toFixed(1)}–${Math.max(...s.notas).toFixed(1)}</div><div class="l">Menor–maior obj.</div></div>
    </div>
    <div class="rot">Acerto por questão</div>
    ${s.item.map((v,q)=>`<div class="barra"><span class="q">${String(q+1).padStart(2,"0")}</span>
      <span class="t"><span class="f ${v<50?"baixo":v<75?"medio":""}" style="width:${v}%"></span></span>
      <span class="p">${Math.round(v)}%</span></div>`).join("")}
    <div class="rot">Desempenho por habilidade</div>
    ${s.habs.map(([h,v])=>`<div class="barra"><span class="lb">${esc(h)}</span>
      <span class="t"><span class="f ${v<50?"baixo":v<75?"medio":""}" style="width:${v}%"></span></span>
      <span class="p">${Math.round(v)}%</span></div>`).join("")}
    <div class="rot">Parecer automático</div>
    ${diagnostico(s)}
    <button class="btn sec" id="bRel" style="margin-top:14px">Baixar relatório</button>`;
  $("#bRel").onclick=()=>baixarRelatorio(A,s);
}
function baixarRelatorio(A,s){
  const p=provaAtiva(), t=turmaAtiva(), e=escolaDe(t.escola);
  const lin=[], L=x=>lin.push(x);
  L("RELATÓRIO DE DESEMPENHO");
  L(e.nome); L("Turma "+t.nome+" · "+t.serie+" · "+t.disciplina);
  L("Prova: "+p.codigo+(p.titulo?" — "+p.titulo:"")+"   ("+p.nq+" questões, A–"+LETRAS_ATE(p.no)+")");
  L("Gerado em "+new Date().toLocaleString("pt-BR")); L("");
  L("ESTATÍSTICAS GERAIS");
  L("  Estudantes corrigidos ...... "+s.n+" de "+(t.alunos.length||s.n));
  L("  Média final ................ "+s.medFinal.toFixed(2)+" de "+s.max);
  L("  Média da parte objetiva .... "+s.med.toFixed(2)+" de 10");
  L("  Aproveitamento médio ....... "+(s.med*10).toFixed(1)+"%");
  L("  Média de acertos ........... "+s.mediaAc.toFixed(2)+" de "+p.nq);
  L("  Média de erros ............. "+s.mediaEr.toFixed(2));
  L("  Nota mínima / máxima ....... "+Math.min(...s.notas).toFixed(1)+" / "+Math.max(...s.notas).toFixed(1));
  L("  Com nota 6,0 ou mais ....... "+s.aprov+" ("+pct(s.aprov,s.n)+"%)"); L("");
  L("ANÁLISE DAS QUESTÕES");
  s.item.map((v,q)=>[q+1,v]).sort((a,b)=>b[1]-a[1]).forEach(([q,v])=>
    L("  Q"+String(q).padStart(2,"0")+"  acerto "+String(Math.round(v)).padStart(3)+"%   erro "+
      String(Math.round(100-v)).padStart(3)+"%   "+(p.habs[q-1]||"")));
  L("");
  L("ANÁLISE POR HABILIDADE  (da mais frágil para a mais dominada)");
  s.habs.forEach(([h,v])=>L("  "+String(Math.round(v)).padStart(3)+"%   "+h));
  L(""); L("PARECER");
  L(diagnostico(s).replace(/<li>/g,"\n  - ").replace(/<b>/g,"\n").replace(/<[^>]+>/g," ")
     .replace(/\n{3,}/g,"\n\n").replace(/[ \t]+/g," ").trim());
  L(""); L("NOTAS INDIVIDUAIS");
  A.slice().sort((a,b)=>ordNum(a.numero,b.numero)).forEach(a=>
    L("  "+String(a.numero).padEnd(4)+String(a.nome).padEnd(42)+
      "nota "+(a.nota!=null?a.nota:notaFinal(p,a)).toFixed(1).padStart(4)+"   acertos "+
      String(a.acertos).padStart(2)+"/"+p.nq+"   errou: "+(a.erradas.join(",")||"—")));
  baixar(lin.join("\r\n"),`relatorio_${t.nome}_${p.codigo}.txt`,"text/plain");
}
function baixar(txt,nome,tipo){
  const u=URL.createObjectURL(new Blob(["\uFEFF"+txt],{type:tipo+";charset=utf-8"}));
  const a=document.createElement("a"); a.href=u; a.download=nome; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1500);
}
$("#bCsv").onclick=()=>{
  const p=provaAtiva(), t=turmaAtiva(); if(!p) return;
  const cab=["escola","turma","numero","aluno","nota_final","nota_objetiva","nota_escrita","acertos","erros","aproveitamento",
    "questoes_erradas","origem","prova",...Array.from({length:p.nq},(_,i)=>"Q"+(i+1))];
  const feitos={}; resDa(p.id).forEach(r=>feitos[r.numero]=r);
  const A=alunosEm(t,p.periodo||1).map(al=>feitos[al.numero]||
      {numero:al.numero,nome:al.nome,acertos:null,erros:null,notaDisc:null,
       erradas:[],origem:"",R:[]})
    .concat(resDa(p.id).filter(r=>!alunosEm(t,p.periodo||1).some(al=>al.numero===r.numero)))
    .sort((a,b)=>ordNum(a.numero,b.numero));
  const e=escolaDe(t.escola);
  const vg=x=>(x==null?"":Number(x).toFixed(2).replace(".",","));
  const lin=A.map(a=>[e.curto,t.nome,a.numero,`"${String(a.nome).replace(/"/g,'""')}"`,
    vg(a.acertos==null?null:(a.nota!=null?a.nota:notaFinal(p,a))),
    vg(a.acertos==null?null:pontosObj(p)*a.acertos/p.nq),
    vg(a.acertos==null?null:(a.notaDisc||0)),
    a.acertos==null?"":a.acertos, a.erros==null?"":a.erros,
    a.acertos==null?"":pct(a.acertos,p.nq)+"%",`"${(a.erradas||[]).join(", ")}"`,
    a.origem||"pendente",p.codigo,
    ...a.R.map(r=>r||"")].join(";"));
  baixar([cab.join(";"),...lin].join("\r\n"),
    `notas_${t.nome}_${p.codigo}_${new Date().toISOString().slice(0,10)}.csv`,"text/csv");
};
$("#bZerar").onclick=()=>{
  const p=provaAtiva(); if(!p) return;
  const n=resDa(p.id).length;
  if(!confirm("Apagar os "+n+" resultados desta prova? A prova e a turma continuam.")) return;
